  <head>

    <title>Nav Jeevan Ayurvedic Upchar Kendra (Dr. Sharavan Kumar) - Gorakhpur</title>

    <!-- Favicon -->

    <!-- Theme & Color Initializer -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('navjeewan_theme') || 'light';
          var color = localStorage.getItem('navjeewan_color') || 'forest';
          var lang = localStorage.getItem('navjeewan_lang') || 'en';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
          document.documentElement.setAttribute('data-color', color);
          document.documentElement.setAttribute('data-lang', lang);
        } catch (e) {}
      })();
    </script>
