<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd" />
      <stop offset="35%" stop-color="#dfa83d" />
      <stop offset="70%" stop-color="#b67f1b" />
      <stop offset="100%" stop-color="#936412" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d32" />
      <stop offset="60%" stop-color="#0b2e1e" />
      <stop offset="100%" stop-color="#051910" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55a630" />
      <stop offset="50%" stop-color="#2b9348" />
      <stop offset="100%" stop-color="#196f3d" />
    </linearGradient>

    <linearGradient id="potGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3" />
      <stop offset="25%" stop-color="#e9b642" />
      <stop offset="60%" stop-color="#c48a1b" />
      <stop offset="100%" stop-color="#8a5a06" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Paths for Circular Arcs -->
    <path id="topTextArc" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" />
    <path id="bottomTextArc" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="250" cy="250" r="240" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="7" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="4,4" />

  <!-- Inner Cream Disc -->
  <circle cx="250" cy="250" r="185" fill="#fcfaf6" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="250" cy="250" r="176" fill="none" stroke="#e0cdb0" stroke-width="1" />

  <!-- Decorative Sacred Rays behind Kalash -->
  <g opacity="0.45" stroke="url(#goldGrad)" stroke-width="1.2">
    <line x1="250" y1="210" x2="250" y2="100" />
    <line x1="250" y1="210" x2="310" y2="115" />
    <line x1="250" y1="210" x2="355" y2="155" />
    <line x1="250" y1="210" x2="190" y2="115" />
    <line x1="250" y1="210" x2="145" y2="155" />
  </g>

  <!-- Curving Circular Brand Text -->
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="21.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="3.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      NAV JEEVAN AYURVEDIC
    </textPath>
  </text>

  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="14.5" font-weight="600" fill="#f8e7b5" letter-spacing="4.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      UPCHAR KENDRA • ESTD. 2011
    </textPath>
  </text>

  <!-- Center Artwork: Ayurvedic Kalash, Lotus & Medicinal Leaves -->
  <g transform="translate(0, 10)">
    <!-- Lotus Petals (Foundation) -->
    <!-- Center Back Lotus -->
    <path d="M 250,335 C 235,310 235,280 250,265 C 265,280 265,310 250,335 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Left Lotus Petal -->
    <path d="M 245,335 C 215,320 185,295 180,270 C 205,275 235,305 245,335 Z" fill="url(#goldGrad)" />
    <!-- Right Lotus Petal -->
    <path d="M 255,335 C 285,320 315,295 320,270 C 295,275 265,305 255,335 Z" fill="url(#goldGrad)" />
    <!-- Far Left Petal -->
    <path d="M 240,338 C 200,332 165,310 155,290 C 180,295 215,322 240,338 Z" fill="url(#goldGrad)" opacity="0.8" />
    <!-- Far Right Petal -->
    <path d="M 260,338 C 300,332 335,310 345,290 C 320,295 285,322 260,338 Z" fill="url(#goldGrad)" opacity="0.8" />

    <!-- Medicinal Leaves Sprouting from Amrit Kalash -->
    <!-- Central Main Tulsi Leaf -->
    <path d="M 250,195 C 238,150 240,115 250,95 C 260,115 262,150 250,195 Z" fill="url(#leafGrad)" stroke="#114b29" stroke-width="1.5" />
    <path d="M 250,195 L 250,105" stroke="#70d655" stroke-width="1.2" opacity="0.75" />

    <!-- Left Upper Leaf -->
    <path d="M 245,190 C 215,160 200,135 195,115 C 220,125 240,155 245,190 Z" fill="url(#leafGrad)" stroke="#114b29" stroke-width="1.2" />
    <!-- Right Upper Leaf -->
    <path d="M 255,190 C 285,160 300,135 305,115 C 280,125 260,155 255,190 Z" fill="url(#leafGrad)" stroke="#114b29" stroke-width="1.2" />

    <!-- Left Lower Spreading Leaf -->
    <path d="M 240,198 C 200,185 170,170 160,150 C 185,155 220,180 240,198 Z" fill="url(#leafGrad)" stroke="#114b29" stroke-width="1.2" />
    <!-- Right Lower Spreading Leaf -->
    <path d="M 260,198 C 300,185 330,170 340,150 C 315,155 280,180 260,198 Z" fill="url(#leafGrad)" stroke="#114b29" stroke-width="1.2" />

    <!-- Sacred Kalash Pot (Body) -->
    <!-- Kalash Rim / Neck -->
    <ellipse cx="250" cy="205" rx="30" ry="7" fill="url(#potGrad)" stroke="#684203" stroke-width="1.2" />
    <!-- Kalash Top Spout / Neck Ring -->
    <path d="M 226,205 C 228,218 224,226 215,236 C 205,250 200,270 206,290 C 215,312 235,322 250,322 C 265,322 285,312 294,290 C 300,270 295,250 285,236 C 276,226 272,218 274,205 Z" fill="url(#potGrad)" stroke="#684203" stroke-width="1.8" filter="url(#goldGlow)" />

    <!-- Kalash Decorative Carvings -->
    <path d="M 215,250 Q 250,265 285,250" fill="none" stroke="#684203" stroke-width="1.5" />
    <path d="M 210,266 Q 250,282 290,266" fill="none" stroke="#684203" stroke-width="1.5" />
    <path d="M 214,284 Q 250,300 286,284" fill="none" stroke="#684203" stroke-width="1.5" />

    <!-- Center Swastik / Sacred Healing Emblem on Pot -->
    <circle cx="250" cy="275" r="9" fill="none" stroke="#684203" stroke-width="1.5" />
    <circle cx="250" cy="275" r="3" fill="#684203" />

    <!-- Kalash Base Ring -->
    <ellipse cx="250" cy="322" rx="26" ry="5.5" fill="url(#goldGrad)" stroke="#684203" stroke-width="1.2" />
  </g>

  <!-- Sanskrit Tagline at bottom disc -->
  <text x="250" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f3d26" text-anchor="middle" letter-spacing="2">
    GORAKHPUR • SIKTAUR
  </text>
  <text x="250" y="394" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#c69234" text-anchor="middle" letter-spacing="1.2">
    ॥ सर्वे सन्तु निरामयाः ॥
  </text>
</svg>
